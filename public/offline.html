<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne — EMAB ERP</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f9f9f7;
      color: #0b0b0b;
    }
    .card {
      max-width: 360px;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #1f63e0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin: 0 auto 1rem;
    }
    p { color: #52514e; font-size: 0.95rem; }
    button {
      margin-top: 1rem;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: none;
      background: #1f63e0;
      color: white;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">E</div>
    <h1>Connexion indisponible</h1>
    <p>Vous êtes hors ligne. Reconnectez-vous à internet pour continuer à utiliser EMAB ERP.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
